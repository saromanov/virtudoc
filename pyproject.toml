[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtudoc"
version = "0.1.0"
description = "Local documentation server for AI agents (MCP, SQLite FTS5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "markdown-it-py>=3.0,<4",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
virtudoc = "virtudoc.cli:main"

[tool.setuptools.packages.find]
include = ["virtudoc*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
# RUF001–003 flag intentional Cyrillic in user-facing strings and test data
# (Russian morphology support is a core feature).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
