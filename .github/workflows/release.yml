name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publishing: configure the "virtudoc" publisher on PyPI
        # (Account settings -> Publishing -> GitHub: saromanov/virtudoc,
        # workflow: release.yml, environment: pypi) before the first tag.
